"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    courses: [Course!]! @all
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}

type Course {
    id: ID!
    title: String!
    description: String
    level: String!
    created_at: DateTime!
    updated_at: DateTime!

    lessons: [Lesson!]! @hasMany
}

type Lesson {
    id: ID!
    title: String!
    content: String
    position: Int!
    created_at: DateTime!
    updated_at: DateTime!

    exercises: [Exercise!]! @hasMany
}

type Exercise {
    id: ID!
    title: String!
    description: String
    position: Int!
    created_at: DateTime!
    updated_at: DateTime!
}

type Mutation {
    createCourse(
        title: String!
            @rules(apply: ["min:3", "max:255"])

        description: String
            @rules(apply: ["nullable", "max:5000"])

        level: String!
            @rules(apply: ["in:beginner,intermediate,advanced"])
    ): Course
        @field(resolver: "App\\GraphQL\\Mutations\\CourseMutation@create")

    updateCourse(
        id: ID!
            @rules(apply: ["exists:courses,id"])

        title: String
            @rules(apply: ["sometimes", "min:3", "max:255"])

        description: String
            @rules(apply: ["nullable", "max:5000"])

        level: String
            @rules(apply: ["in:beginner,intermediate,advanced"])
    ): Course @update

    deleteCourse(
        id: ID!
            @rules(apply: ["exists:courses,id"])
    ): Course @delete
}
